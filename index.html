<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ApexCare Nursing</title>
<meta name="description" content="نظام التقرير الأسبوعي للتمريض — ApexCare">
<meta name="theme-color" content="#0E6B66">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<style>
/* ══════════ TOKENS ══════════ */
:root{
  color-scheme:light;
  --bg:#F5F4F0;--surface:#FFFFFF;--surface-2:#FAF9F6;--sunken:#EFEDE7;
  --line:#E6E3DB;--line-strong:#D3CFC4;
  --ink:#14171A;--ink-2:#474B51;--ink-3:#7A7E85;
  --accent:#0E6B66;--accent-hover:#0B5A56;--accent-ink:#FFFFFF;--accent-soft:#E2EFEC;--accent-line:#B9D8D3;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;
  --good-soft:#E5F3E3;--warn-soft:#FCF1D8;--serious-soft:#FBE8DF;--crit-soft:#FAE3E3;--na-soft:#EDEBE5;
  --s1:#2a78d6;--s2:#eb6834;
  --grid:#ECEAE4;
  --r-sm:8px;--r:12px;--r-lg:18px;--r-xl:24px;
  --sh-1:0 1px 0 rgba(20,23,26,.04),0 1px 2px rgba(20,23,26,.04);
  --sh-2:0 1px 2px rgba(20,23,26,.05),0 10px 30px -14px rgba(20,23,26,.18);
  --sh-3:0 2px 6px rgba(20,23,26,.06),0 30px 60px -20px rgba(20,23,26,.28);
  --ease:cubic-bezier(.2,.8,.2,1);--ease-in-out:cubic-bezier(.65,0,.35,1);
  --font:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D0F11;--surface:#15181B;--surface-2:#1A1E22;--sunken:#101214;
    --line:#252A2F;--line-strong:#343A41;
    --ink:#F1F2F3;--ink-2:#B7BCC2;--ink-3:#838990;
    --accent:#3DB5AB;--accent-hover:#52C4BA;--accent-ink:#04201D;--accent-soft:#11302D;--accent-line:#1F4E49;
    --good-soft:#132717;--warn-soft:#2D2410;--serious-soft:#2E1D15;--crit-soft:#2F1617;--na-soft:#1E2226;
    --s1:#3987e5;--s2:#d95926;--grid:#22272C;
    --sh-1:0 1px 0 rgba(0,0,0,.3);--sh-2:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);--sh-3:0 30px 60px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D0F11;--surface:#15181B;--surface-2:#1A1E22;--sunken:#101214;
  --line:#252A2F;--line-strong:#343A41;
  --ink:#F1F2F3;--ink-2:#B7BCC2;--ink-3:#838990;
  --accent:#3DB5AB;--accent-hover:#52C4BA;--accent-ink:#04201D;--accent-soft:#11302D;--accent-line:#1F4E49;
  --good-soft:#132717;--warn-soft:#2D2410;--serious-soft:#2E1D15;--crit-soft:#2F1617;--na-soft:#1E2226;
  --s1:#3987e5;--s2:#d95926;--grid:#22272C;
  --sh-1:0 1px 0 rgba(0,0,0,.3);--sh-2:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);--sh-3:0 30px 60px -20px rgba(0,0,0,.7);
}

/* ══════════ BASE ══════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:'Inter',var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.hidden{display:none!important}
.ico{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
.icon-btn .ico{width:19px;height:19px}
.logo .ico{width:20px;height:20px}
.is-demo .btn[onclick*="print"]{display:none}
.sched{padding:14px}
.sched-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sch{position:relative;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2)}
.sch b{font-size:14px}.sch span{font-size:12px;color:var(--ink-3)}.sch i{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.sch em{position:absolute;top:8px;inset-inline-end:8px;font-style:normal;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--ink);color:var(--bg)}
.sch.now{border-color:var(--accent);background:var(--accent-soft)}
.sch.late.now{border-color:var(--warn);background:var(--warn-soft)}
.sch.out.now{border-color:var(--crit);background:var(--crit-soft)}
.sch.out{border-style:dashed}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.mini div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.mini b{display:block;font-size:20px;font-weight:600;font-family:Inter}.mini span{font-size:11.5px;color:var(--ink-3)}
.chipline{display:flex;flex-wrap:wrap;gap:4px}
select.input.demo-clock{height:36px;width:190px;flex:none;padding:0 10px;font-size:12.5px;border-color:var(--warn)}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.pinfo{flex:1;min-width:0}.pinfo b{font-weight:500}.pinfo .muted{font-size:11.5px}
.avatar.sm{width:28px;height:28px;font-size:11px}
.plist{max-height:330px;overflow:auto}
select.input.status-select{height:36px;min-width:150px;padding:0 10px;font-size:13px;font-weight:500}
select.input.status-select.st-leave{background:var(--accent-soft);border-color:var(--accent-line)}
select.input.status-select.st-inactive{background:var(--na-soft)}
.leave-note{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11.5px;color:var(--ink-2)}
.linkbtn{font-size:11.5px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.heat i.leave{background:var(--accent-soft);border:1.5px solid var(--accent)}
.demo-box{margin-top:18px;padding:14px;border:1px dashed var(--accent-line);background:var(--accent-soft);border-radius:var(--r)}
.demo-box b{display:block;font-size:12.5px;font-weight:600;margin-bottom:10px}
select.input.demo-switch{height:36px;width:170px;flex:none;padding:0 10px;font-size:12.5px;background:var(--accent-soft);border-color:var(--accent-line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ══════════ MOTION ══════════ */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sheet{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}
.rise{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}

/* ══════════ LOGIN ══════════ */
#login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.login-art{position:relative;overflow:hidden;background:#0B3F3C;color:#E8F3F1;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login-art::before{content:"";position:absolute;inset:0;background:
  radial-gradient(900px 500px at 85% 10%,rgba(94,208,196,.28),transparent 60%),
  radial-gradient(700px 500px at 0% 100%,rgba(255,196,120,.14),transparent 60%);}
.login-art svg.grid{position:absolute;inset:0;width:100%;height:100%;opacity:.12}
.login-art>*{position:relative}
.brandmark{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.2px}
.brandmark .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#5FD0C4,#128277);color:#062624;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 20px -8px rgba(0,0,0,.5)}
.login-art h1{font-size:clamp(28px,3.4vw,44px);line-height:1.2;font-weight:700;max-width:14ch;letter-spacing:-.01em}
.login-art p.lead{color:#B8D6D1;max-width:40ch;margin-top:14px;font-size:15px}
.cycle{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap}
.cycle div{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);backdrop-filter:blur(6px);border-radius:12px;padding:10px 14px;font-size:12.5px;color:#D5E9E6}
.cycle b{display:block;font-size:13px;color:#fff;font-weight:600}
.login-foot{font-size:12px;color:#8FB8B1}
.login-pane{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-box{width:100%;max-width:380px;animation:rise .7s var(--ease) both}
.login-box h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.login-box .sub{color:var(--ink-3);margin:6px 0 28px}
.lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);margin-bottom:28px}
.lang-switch button{padding:5px 12px;border-radius:999px;font-size:12.5px;color:var(--ink-2);transition:all .2s var(--ease)}
.lang-switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ══════════ FORMS ══════════ */
.field{margin-bottom:16px}
.field>label,.label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:7px}
.input,select.input,textarea.input{width:100%;height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);transition:border-color .2s,box-shadow .2s;outline:none}
textarea.input{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.input[dir="ltr"]{text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r);font-weight:600;font-size:13.5px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 16px -8px var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.lg{height:48px;padding:0 22px;font-size:15px;border-radius:14px}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);transition:background .2s}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.form-error{background:var(--crit-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;display:flex;gap:8px;align-items:flex-start;animation:rise .3s var(--ease)}
.form-error::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--crit);margin-top:6px}

/* segmented choice */
.seg{display:inline-flex;flex-wrap:wrap;gap:8px}
.seg button{min-width:88px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:all .2s var(--ease)}
.seg button:hover{border-color:var(--ink-3);color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 1px var(--accent) inset}
.seg button[aria-pressed="true"].neg{border-color:var(--crit);background:var(--crit-soft);box-shadow:0 0 0 1px var(--crit) inset}
.seg button .dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);transition:background .2s}
.seg button[aria-pressed="true"] .dot{background:var(--accent)}
.seg button[aria-pressed="true"].neg .dot{background:var(--crit)}
.rating{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:420px}
.rating button{height:58px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .2s var(--ease)}
.rating button b{font-size:17px;font-family:Inter}
.rating button span{font-size:10.5px;color:var(--ink-3)}
.rating button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset;transform:translateY(-1px)}

/* ══════════ SHELL ══════════ */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;gap:16px}
.topbar .brandmark{color:var(--ink);font-size:14.5px}
.topbar .brandmark .logo{width:34px;height:34px;border-radius:10px}
.topbar .brandmark small{display:block;font-size:11px;color:var(--ink-3);font-weight:500;margin-top:1px;white-space:nowrap}
.nav{display:flex;gap:2px;background:var(--sunken);border:1px solid var(--line);padding:3px;border-radius:12px;position:relative;margin-inline-start:12px}
.nav a{position:relative;z-index:1;padding:6px 14px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2);text-decoration:none;transition:color .2s;white-space:nowrap}
.nav a[aria-current="page"]{color:var(--ink)}
.nav .ind{position:absolute;top:3px;bottom:3px;border-radius:9px;background:var(--surface);box-shadow:var(--sh-1);transition:all .35s var(--ease)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 12px;border-radius:12px}
[dir="ltr"] .who{padding:4px 12px 4px 4px}
.avatar{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.who .meta{line-height:1.25}
.who .meta b{font-size:13px;font-weight:600;display:block;white-space:nowrap}
.who .meta span{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
main{max-width:1320px;margin:0 auto;padding:28px 24px 96px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.page-head p{color:var(--ink-3);margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .input{height:38px;width:auto;min-width:130px;font-size:13px}

/* ══════════ CARDS & KPI ══════════ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card-h h3{font-size:14.5px;font-weight:600}
.card-h .sub{font-size:12px;color:var(--ink-3)}
.card-b{padding:16px 18px 18px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .k-label{font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .k-val{font-size:32px;font-weight:600;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.kpi .k-val small{font-size:15px;color:var(--ink-3);font-weight:500;margin-inline-start:2px}
.kpi .k-sub{font-size:12px;color:var(--ink-3);margin-top:6px}
.kpi.hero{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%);border-color:var(--accent-line)}
.meter{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent);transform-origin:right;animation:grow .9s var(--ease) both}
[dir="ltr"] .meter i{transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.chart-box{position:relative;height:260px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ══════════ PILLS ══════════ */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--na-soft);color:var(--ink);white-space:nowrap}
.pill svg{width:12px;height:12px;flex:none}
.pill.good{background:var(--good-soft)}.pill.good svg{color:var(--good)}
.pill.warn{background:var(--warn-soft)}.pill.warn svg{color:#C98500}
.pill.serious{background:var(--serious-soft)}.pill.serious svg{color:var(--serious)}
.pill.crit{background:var(--crit-soft)}.pill.crit svg{color:var(--crit)}
.pill.accent{background:var(--accent-soft)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;background:var(--sunken);color:var(--ink-2);border:1px solid var(--line)}

/* ══════════ TABLE ══════════ */
.tbl-wrap{overflow:auto;border-top:1px solid var(--line);margin-top:14px;max-height:560px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface-2);font-weight:500;color:var(--ink-3);font-size:12px;text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.click{cursor:pointer}
.tbl .strong{font-weight:600}
.empty{padding:36px 18px;text-align:center;color:var(--ink-3);font-size:13px}
.empty b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:2px}

/* heat strip */
.heat{display:flex;gap:3px}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--na-soft);display:block;transition:transform .15s}
.heat i:hover{transform:scale(1.35)}
.heat i.on_time,.heat i.early{background:var(--good)}
.heat i.late{background:var(--warn)}
.heat i.very_late{background:var(--serious)}
.heat i.missing{background:var(--crit);opacity:.85}
.heat i.na{background:transparent;border:1px dashed var(--line-strong)}

/* ══════════ ISSUES ══════════ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:500;color:var(--ink-3);position:relative;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;inset-inline:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);animation:fade .3s}

.issues{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}

.issue .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.issue h4{font-size:15px;font-weight:600;line-height:1.35}
.issue .desc{color:var(--ink-2);font-size:13px}
.issue .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.issue .meta b{color:var(--ink-2);font-weight:500}
.issue .act{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.issue.sev-high{box-shadow:inset 3px 0 0 var(--crit),var(--sh-1)}
[dir="rtl"] .issue.sev-high{box-shadow:inset -3px 0 0 var(--crit),var(--sh-1)}
.repeat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink);background:var(--serious-soft);padding:2px 8px;border-radius:99px}

/* ══════════ NURSE ══════════ */
.n-wrap{max-width:860px;margin:0 auto}
.week-card{padding:22px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:linear-gradient(135deg,#0E4F4B,#0B3F3C);color:#E9F4F2;border:0;overflow:hidden;position:relative}
.week-card::after{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(95,208,196,.35),transparent 65%)}
[dir="rtl"] .week-card::after{inset:auto auto -80px -60px}
.week-card h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.week-card p{color:#A9CEC8;font-size:13px;margin-top:4px}
.week-card .ring{width:84px;height:84px;position:relative;z-index:1}
.week-card .ring svg{transform:rotate(-90deg)}
.week-card .ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 18px Inter}
.week-card .ring-alt{position:relative;z-index:1;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px 16px}
.week-card .ring-alt b{display:block;font-size:28px;font-weight:600;line-height:1.1}
.week-card .ring-alt span{font-size:11.5px;color:#A9CEC8}
.week-card .pill{background:rgba(255,255,255,.12);color:#fff;margin-top:12px}
.step{padding:20px;display:grid;grid-template-columns:34px 1fr;gap:14px;transition:border-color .3s,box-shadow .3s}
.step .no{width:30px;height:30px;border-radius:10px;background:var(--sunken);display:grid;place-items:center;font:600 13px Inter;color:var(--ink-3);transition:all .3s var(--ease)}
.step.done .no{background:var(--accent);color:var(--accent-ink)}
.step h3{font-size:15.5px;font-weight:600;line-height:1.4}
.step .hint{color:var(--ink-3);font-size:12.5px;margin:2px 0 14px}
.step .more{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;animation:rise .35s var(--ease)}
.clinics{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.clinics button{min-height:52px;padding:8px 12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);text-align:start;font-weight:500;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:6px;transition:all .2s var(--ease)}
.clinics button:hover{border-color:var(--ink-3)}
.clinics button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.clinics button[disabled]{opacity:.55;cursor:not-allowed;background:var(--sunken);border-style:dashed}
.clinics button svg{width:16px;height:16px;color:var(--good);flex:none}
.tool-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 150px 36px;gap:8px;align-items:center;margin-bottom:8px;animation:rise .3s var(--ease)}
.submit-bar{position:fixed;inset-inline:0;bottom:0;z-index:40;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.submit-bar .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:16px}
.progress{flex:1}
.progress .bar{height:6px;background:var(--sunken);border-radius:99px;overflow:hidden;margin-top:6px}
.progress .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s var(--ease)}
.progress span{font-size:12.5px;color:var(--ink-2)}
.hist{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
.hist div{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:38px}
.hist i{width:26px;height:26px;border-radius:8px;background:var(--na-soft);display:grid;place-items:center;color:#fff}

.hist i.very_late{background:var(--serious)}
.hist i.missing{background:transparent;border:1.5px dashed var(--crit)}
.hist span{font-size:10.5px;color:var(--ink-3);font-family:Inter}
.done-view{text-align:center;padding:48px 24px}
.done-view .check{width:88px;height:88px;margin:0 auto 18px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;animation:pop .6s var(--ease) both}
.done-view .check path{stroke:var(--accent);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .35s var(--ease) forwards}
.done-view h2{font-size:24px;font-weight:700}
.done-view p{color:var(--ink-2);margin-top:6px}

/* ══════════ MODAL / TOAST ══════════ */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(10,12,14,.42);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.modal{width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-3);animation:sheet .35s var(--ease)}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 22px 0}
.modal-h h3{font-size:17px;font-weight:600;flex:1}
.modal-b{padding:18px 22px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:0 22px 20px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.toasts{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
[dir="ltr"] .toasts{transform:translateX(-50%)}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;box-shadow:var(--sh-3);font-size:13px;font-weight:500;animation:sheet .35s var(--ease);display:flex;gap:10px;align-items:center}
.toast.err::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--crit)}
.toast.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.skel{background:linear-gradient(90deg,var(--sunken) 25%,var(--surface-2) 50%,var(--sunken) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:var(--r-lg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:10px;font-size:12.5px;cursor:pointer;transition:all .15s}
.chips input{accent-color:var(--accent)}
.chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.temp-pass{font:600 22px Inter;letter-spacing:.12em;background:var(--sunken);border:1px dashed var(--line-strong);border-radius:12px;padding:14px;text-align:center;direction:ltr}
.notice{background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink)}

/* ══════════ RESPONSIVE / PRINT ══════════ */
@media (max-width:1000px){.g-2,.g-2e{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  #login{grid-template-columns:1fr}
  .login-art{padding:28px 20px;min-height:auto}
  .login-art h1{font-size:26px}
  .cycle,.login-foot{display:none}
  .topbar-in{padding:0 16px;height:auto;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
  .nav{order:5;width:100%;margin:0;overflow-x:auto}
  .who .meta{display:none}
  main{padding:20px 16px 110px}
  .page-head h1{font-size:22px}
  .kpi .k-val{font-size:26px}
  .tool-row{grid-template-columns:1fr 70px 36px}
  .tool-row select{grid-column:1/3}
  .week-card{grid-template-columns:1fr}
  .week-card .ring{display:none}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
}
@media print{
  .topbar,.submit-bar,.toolbar,.btn,.icon-btn,.tabs{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
  .tbl-wrap{max-height:none;overflow:visible}
}

}

function modal({ title, body, foot = '', wide = false, onMount, onClose }) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="إغلاق">${icon('x')}</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  const close = () => { scrim.style.transition = 'opacity .18s'; scrim.style.opacity = '0'; setTimeout(() => scrim.remove(), 180); document.removeEventListener('keydown', onKey); if (onClose) onClose(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  scrim.addEventListener('click', e => { if (e.target === scrim || e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(scrim);
  const first = scrim.querySelector('input,select,textarea');
  if (first) setTimeout(() => first.focus(), 60);
  if (onMount) onMount(scrim, close);
  return { el: scrim, close };
}

function confirmDialog(message) {
  return new Promise(resolve => {
    let answered = false;
    const m = modal({
      title: 'تأكيد', body: `<p>${esc(message)}</p>`,
      foot: `<button class="btn" data-no>إلغاء</button><button class="btn primary" data-yes>متابعة</button>`,
      onMount(el, close) {
        $('[data-yes]', el).onclick = () => { answered = true; close(); resolve(true); };
        $('[data-no]', el).onclick = () => { answered = true; close(); resolve(false); };
        el.addEventListener('click', e => { if (!answered && (e.target === el || e.target.closest('[data-close]'))) { answered = true; resolve(false); } });
      },
    });
  });
}

function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.label = btn.innerHTML; btn.innerHTML = `<span class="spin"></span>${label ? esc(label) : ''}`; btn.disabled = true; }
  else { btn.innerHTML = btn.dataset.label || btn.innerHTML; btn.disabled = false; }
}

function countUp(root = document) {
  $$('[data-count]', root).forEach(el => {
    const target = Number(el.dataset.count);
    if (!isFinite(target)) return;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { el.textContent = target; return; }
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function downloadCSV(name, headers, rows) {
  if (window.APEX_DEMO) {   // التنزيل محجوب داخل إطار العرض: نعرض النص للنسخ
    const text = [headers, ...rows].map(r => r.map(v => { const x = String(v == null ? '' : v); return /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x; }).join(',')).join('\n');
    modal({ title: name, wide: true, body: `<p class="muted" style="margin-bottom:10px">في النسخة الفعلية يُنزَّل هذا كملف CSV يفتح في Excel.</p><textarea class="input" id="csv-t" readonly style="min-height:220px;direction:ltr;font-family:monospace;font-size:12px">${esc(text)}</textarea>`,
      foot: `<button class="btn primary" id="csv-c">${icon('copy')}نسخ</button>`, onMount(el) { $('#csv-c', el).onclick = () => copyText(text); } });
    return;
  }
  const q = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = '﻿' + [headers, ...rows].map(r => r.map(q).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('تم النسخ'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('تم النسخ'); }
}

/* ══════════ API ══════════ */
async function api(action, payload = {}) {
  let j;
  if (window.APEX_DEMO_API) {
    j = await window.APEX_DEMO_API(Object.assign({ action, token: state.token }, payload));
  } else {
    if (!API()) throw new Error(t('noApi'));
    let res;
    try {
      res = await fetch(API(), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // يتجنب طلب preflight مع Apps Script
        body: JSON.stringify(Object.assign({ action, token: state.token }, payload)),
      });
    } catch (e) { throw new Error(t('netErr')); }
    try { j = await res.json(); } catch (e) { throw new Error(t('netErr')); }
  }
  if (!j.ok) {
    if (j.code === 'AUTH') { logout(true); }
    if (j.code === 'MUST_CHANGE') { renderChangePassword(); }
    const err = new Error(j.error || 'خطأ');
    err.code = j.code;
    throw err;
  }
  return j.data;
}

const allowedPages = u => Object.keys(PAGES).filter(k => PAGES[k].roles.includes(u.role));

async function boot() {
  if (!state.token) return renderLogin();
  if (!state.user) {
    try { state.user = (await api('me')).user; }
    catch (e) { if (e.code !== 'AUTH') renderLogin(e.message); return; }
  }
  if (state.user.mustChange) return renderChangePassword();
  if (state.user.role !== 'nurse') applyLang('ar');
  else applyLang(state.lang);
  route();
}

function currentPage() {

function route() {
  if (!state.user) return;
  const page = currentPage();
  renderShell(page);

}

function renderShell(page) {
  const u = state.user;

/* ══════════ CHARTS ══════════ */
function destroyCharts() { state.charts.forEach(c => { try { c.destroy(); } catch (e) {} }); state.charts = []; }
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function chartReady() {
  return new Promise(res => { if (window.Chart) return res(); const i = setInterval(() => { if (window.Chart) { clearInterval(i); res(); } }, 50); });
}
function chartBase() {
  const ink3 = cssVar('--ink-3'), grid = cssVar('--grid');
  return {
    responsive: true, maintainAspectRatio: false,
    animation: { duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 700, easing: 'easeOutQuart' },
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        rtl: document.dir === 'rtl', textDirection: document.dir,
        backgroundColor: cssVar('--ink'), titleColor: cssVar('--bg'), bodyColor: cssVar('--bg'),
        padding: 10, cornerRadius: 10, boxPadding: 4, usePointStyle: true,
        titleFont: { family: 'IBM Plex Sans Arabic', weight: '600' }, bodyFont: { family: 'IBM Plex Sans Arabic' },
      },
    },
    scales: {
      x: { grid: { display: false }, border: { color: grid }, ticks: { color: ink3, font: { family: 'Inter', size: 11 } } },
      y: { grid: { color: grid }, border: { display: false }, ticks: { color: ink3, font: { family: 'Inter', size: 11 }, padding: 6 } },
    },
    font: { family: 'IBM Plex Sans Arabic' },
  };
}
async function lineChart(canvas, labels, series, { max = 100, suffix = '%' } = {}) {
  await chartReady();
  const o = chartBase();
  o.scales.y.min = 0; if (max) o.scales.y.max = max;
  o.scales.y.ticks.callback = v => v + suffix;
  o.scales.x.reverse = document.dir === 'rtl';
  o.plugins.tooltip.callbacks = { label: c => ` ${c.dataset.label}: ${c.parsed.y == null ? '—' : c.parsed.y + suffix}` };
  if (!canvas || !canvas.isConnected) return;
  const old = Chart.getChart(canvas); if (old) old.destroy();
  const surface = cssVar('--surface');
  const c = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: series.map(s => ({
      label: s.label, data: s.data, borderColor: s.color, backgroundColor: s.color, borderWidth: 2, tension: .32,
      pointRadius: 0, pointHoverRadius: 5, pointHoverBorderWidth: 2, pointHoverBorderColor: surface, spanGaps: true,
      fill: s.fill ? { target: 'origin', above: s.color + '14' } : false,
    })) },
    options: o,
  });
  state.charts.push(c);
  return c;
}
async function barChart(canvas, labels, series, { horizontal = false, max = null, suffix = '' } = {}) {
  await chartReady();
  const o = chartBase();
  const val = horizontal ? 'x' : 'y', cat = horizontal ? 'y' : 'x';
  o.indexAxis = horizontal ? 'y' : 'x';
  o.scales[val].min = 0; if (max) o.scales[val].max = max;
  o.scales[val].ticks.callback = v => v + suffix;
  o.scales[val].grid = { color: cssVar('--grid') };
  o.scales[cat].grid = { display: false };
  o.scales[cat].ticks = { color: cssVar('--ink-2'), font: { family: 'IBM Plex Sans Arabic', size: 12 } };
  if (horizontal) { o.scales.x.reverse = document.dir === 'rtl'; o.scales.y.position = document.dir === 'rtl' ? 'right' : 'left'; }
  else o.scales.x.reverse = document.dir === 'rtl';
  o.interaction = { mode: 'nearest', axis: cat, intersect: false };
  o.plugins.tooltip.callbacks = { label: c => ` ${c.dataset.label}: ${c.parsed[val]}${suffix}` };
  if (!canvas || !canvas.isConnected) return;
  const old = Chart.getChart(canvas); if (old) old.destroy();
  const c = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: series.map(s => ({
      label: s.label, data: s.data, backgroundColor: s.color, borderRadius: 4, borderSkipped: false,
      borderColor: cssVar('--surface'), borderWidth: 1, maxBarThickness: 22, categoryPercentage: .7, barPercentage: .9,
    })) },
    options: o,
  });
  state.charts.push(c);
  return c;
}
const legendHTML = items => `<div class="legend">${items.map(i => `<span><i style="background:${i.color}"></i>${esc(i.label)}</span>`).join('')}</div>`;

function tableHTML(cols, rows, { empty = 'لا توجد بيانات', rowAttr } = {}) {
  if (!rows.length) return `<div class="empty">${esc(empty)}</div>`;

}

      <input class="input num" data-k="qty" type="number" min="1" max="999" inputmode="numeric" value="${tool.qty}" aria-label="${t('qty')}">

        <option value="high" ${tool.severity === 'high' ? 'selected' : ''}>${t('sevHigh')}</option>
        <option value="medium" ${tool.severity === 'medium' ? 'selected' : ''}>${t('sevMed')}</option>
        <option value="low" ${tool.severity === 'low' ? 'selected' : ''}>${t('sevLow')}</option>
      </select>
      <button type="button" class="icon-btn" data-del aria-label="delete">${icon('trash')}</button></div>`;
  const drawTools = () => {
    $('#tool-rows').innerHTML = f.tools.map(toolRow).join('');
    $$('.tool-row').forEach(row => {
      const i = +row.dataset.i;
      $$('[data-k]', row).forEach(inp => inp.oninput = inp.onchange = () => { f.tools[i][inp.dataset.k] = inp.value; update(); });
      $('[data-del]', row).onclick = () => { f.tools.splice(i, 1); drawTools(); update(); };
    });
  };
  $('#add-tool').onclick = () => { f.tools.push({ item: '', qty: 1, severity: 'medium' }); drawTools(); update(); $$('.tool-row [data-k="item"]').pop().focus(); };

  function checks() {
    const expOk = f.expiry_checked === 'no' || (f.expiry_checked === 'yes' && $('#f-exp').value);
    const toolsOk = f.missing_tools === 'no' || (f.missing_tools === 'yes' && f.tools.length && f.tools.every(x => String(x.item).trim()));
    return { clinic: !!f.clinic_id, expiry: !!expOk, steril: !!f.sterilization_ok, fridge: !!f.fridge, card: !!f.employee_card, clean: !!f.cleanliness, tools: !!toolsOk };
  }
  function update() {
    $('#exp-more').classList.toggle('hidden', f.expiry_checked !== 'yes');
    $('#fridge-more').classList.toggle('hidden', f.fridge !== 'ok');
    const showTools = f.missing_tools === 'yes';
    const tm = $('#tools-more');
    if (showTools && tm.classList.contains('hidden')) { tm.classList.remove('hidden'); if (!f.tools.length) { f.tools.push({ item: '', qty: 1, severity: 'medium' }); drawTools(); } }
    if (!showTools) tm.classList.add('hidden');
    const c = checks();
    Object.keys(c).forEach(k => { const s = $(`[data-step="${k}"]`, form); s && s.classList.toggle('done', c[k]); });
    const n = Object.values(c).filter(Boolean).length, total = Object.keys(c).length;
    $('#prog-t').textContent = `${t('progress')} ${n} ${t('of')} ${total}`;
    $('#prog-b').style.width = (n / total * 100) + '%';
  }
  update();
  onClinic();

  form.onsubmit = async e => {
    e.preventDefault();
    const c = checks();
    const firstMissing = Object.keys(c).find(k => !c[k]);
    if (firstMissing) {
      const s = $(`[data-step="${firstMissing}"]`, form);
      s.scrollIntoView({ behavior: 'smooth', block: 'center' });
      s.animate([{ boxShadow: '0 0 0 0 var(--crit)' }, { boxShadow: '0 0 0 4px var(--crit-soft)' }, { boxShadow: '0 0 0 0 transparent' }], { duration: 900 });
      toast(firstMissing === 'tools' && f.missing_tools === 'yes' ? t('fillTools') : t('required'), 'err');
      return;
    }
    const btn = $('#nsubmit');
    busy(btn, true, t('sending'));
    const report = {
      clinic_id: f.clinic_id, expiry_checked: f.expiry_checked, earliest_expiry: f.expiry_checked === 'yes' ? $('#f-exp').value : '',
      expiry_item: $('#f-expi').value, sterilization_ok: f.sterilization_ok, fridge: f.fridge,
      fridge_temp: f.fridge === 'ok' ? $('#f-temp').value : '', employee_card: f.employee_card, cleanliness: f.cleanliness,
      missing_tools: f.missing_tools, tools: f.missing_tools === 'yes' ? f.tools : [],
      other_issue: $('#f-other').value, notes: $('#f-notes').value,
    };
    try {
      const d = await api('nurse.submit', { report });
      showNurseDone(view, d, pending.length > 1);
    } catch (err) {
      busy(btn, false);
      $('#nerr').innerHTML = `<div class="form-error">${esc(err.message)}</div>`;
    }
  };
}

function showNurseDone(view, d, more) {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  const bar = $('.submit-bar'); bar && bar.remove();
  view.innerHTML = `<section class="card done-view rise">
    <div class="check"><svg width="44" height="44" viewBox="0 0 44 44"><path d="M12 23l7 7 14-15"/></svg></div>
    <h2>${t('doneTitle')}</h2>
    <p>${esc(clinicLabel(d.report))} · ${timingPill(d.report.timing)}</p>
    <p class="muted" style="margin-top:14px">${d.issues ? `<b class="num">${d.issues}</b> ${t('doneIssues')}` : t('doneNone')}</p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:24px;flex-wrap:wrap">
      ${more ? `<button class="btn primary lg" id="again">${t('another')}</button>` : ''}
      <button class="btn lg" id="fin">${t('finish')}</button>
    </div></section>`;
  $('#again') && ($('#again').onclick = () => renderNurse(view));
  $('#fin').onclick = () => renderNurse(view);
}

/* ══════════════════════════════════════════════════════════
   HR — الموارد البشرية
   ══════════════════════════════════════════════════════════ */
const hrState = { week: '', q: '', branch: 'ALL', filter: 'all' };
const STATE_LABEL = { active: 'على رأس العمل', leave: 'إجازة', inactive: 'متوقفة عن العمل' };
const fmtDay = s => fmtDate(s, { day: 'numeric', month: 'short' });

async function renderHR(view) {

  try { d = await api('hr.overview', { week: hrState.week, weeks: 12 }); }
  catch (e) { return errorBlock(view, e, () => renderHR(view)); }

  view.innerHTML = `

    <div><h1>التزام الممرضات بالتقرير الأسبوعي</h1><p>أسبوع السبت ${fmtDate(d.week, { day: 'numeric', month: 'long', year: 'numeric' })}</p></div>
    <div class="spacer"></div>
    <div class="toolbar">

    </div>
  </div>

    ${kpiCard('نسبة الالتزام', s.rate, '%', `${s.committed} من ${s.expected} ممرضة سلّمن`, true, 1)}
    ${kpiCard('ملتزمات', s.committed, '', `${s.onTime} في الوقت · ${s.late} متأخرة`, false, 2)}
    ${kpiCard('غير ملتزمات', s.missing, '', d.isCurrent ? 'لم يسلّمن حتى الآن' : 'لم يسلّمن هذا الأسبوع', false, 3)}

      <span><span class="heat"><i class="very_late"></i></span>متأخر جداً</span><span><span class="heat"><i class="missing"></i></span>لم تُسلّم</span>
      <span><span class="heat"><i class="leave"></i></span>إجازة</span><span><span class="heat"><i class="na"></i></span>غير مطلوب</span>
    </div>
  </section>

  <section class="card rise" style="--i:8;margin-top:16px"><div class="card-h"><h3>بطاقات الموظفين غير الموجودة</h3><span class="sub">من اختصاص الموارد البشرية</span></div>
    <div id="cards"></div></section>`;

  countUp(view);
  $('#r-br').value = hrState.branch; $('#r-f').value = hrState.filter;
  const go = w => { hrState.week = w; renderHR(view); };
  $('#wk').onchange = e => e.target.value && go(e.target.value);
  $('#wk-prev').onclick = () => go(addDays(d.week, -7));
  $('#wk-next').onclick = () => go(addDays(d.week, 7));

  /* ───── إرسال تذكير السبت ───── */
  const remind = $('#remind-btn');
  if (remind) remind.onclick = () => {
    const targets = missing.filter(r => r.email || String(r.username).indexOf('@') > 0);
    const already = targets.filter(r => String(r.lastReminder).slice(0, 10) === today).length;
    modal({
      title: ({ open: 'تذكير: فُتح التقديم', deadline: 'تذكير: اليوم موعد التقديم', late: 'تذكير: اليوم آخر يوم (متأخر)', closed: 'إشعار: لم تقدّمي هذا الأسبوع' })[d.reminderKind] || 'إرسال تذكير بالبريد',
      body: `<p>سيصل بريد (بالعربي والإنجليزي) إلى <b class="num">${targets.length}</b> ممرضة لم تسلّم تقرير أسبوع السبت ${fmtDate(d.week, { day: 'numeric', month: 'long' })}.
        <span class="muted">${({ open: 'نص الرسالة: فُتحت نافذة التقديم وموعدها السبت.', deadline: 'نص الرسالة: اليوم موعد التقديم ولم يصلنا تقريرك، مع رابط التقديم.', late: 'نص الرسالة: لم تقدّمي، واليوم الأحد آخر يوم (متأخر)، مع رابط التقديم.', closed: 'نص الرسالة: لم تقدّمي هذا الأسبوع وأُغلقت نافذة التقديم.' })[d.reminderKind] || ''}</span></p>
        ${!d.hasLink && d.reminderKind !== 'closed' ? '<div class="notice" style="margin-top:10px">لم يُضَف رابط المنصة في Settings ← APP_URL، فلن يظهر رابط التقديم في الرسالة.</div>' : ''}
        <div class="plist" style="margin:12px 0;max-height:200px">${targets.map(r => `<div class="prow"><span class="avatar sm">${esc(initials(r.name))}</span><div class="pinfo"><b>${esc(r.name)}</b><div class="muted" dir="ltr" style="text-align:start">${esc(r.email || r.username)}</div></div></div>`).join('')}</div>
        ${already ? `<div class="notice">تم تذكير ${already} منهن اليوم. سيصلهن تذكير آخر.</div>` : ''}<div id="rm-err"></div>`,
      foot: `<button class="btn" data-close>إلغاء</button><button class="btn primary" id="rm-send">${icon('bell')}إرسال الآن</button>`,
      onMount(el, close) {
        $('#rm-send', el).onclick = async () => {
          const b = $('#rm-send', el); busy(b, true, 'جارٍ الإرسال…');
          try {
            const r = await api('hr.remind');
            close();
            toast(`تم إرسال ${r.sent.length} تذكير${window.APEX_DEMO ? ' (عرض تجريبي: لا يُرسل بريد فعلي)' : ''}`);
            if (r.noEmail.length || r.failed.length) setTimeout(() => toast(`لم يُرسل إلى: ${r.noEmail.concat(r.failed).join('، ')}`, 'err'), 600);
            renderHR(view);
          } catch (e) { busy(b, false); $('#rm-err', el).innerHTML = `<div class="form-error">${esc(e.message)}</div>`; }
        };
      },
    });
  };

  /* ───── جدول الحالة ───── */
  const statusCell = r => `<select class="input status-select st-${r.state}" data-status="${esc(r.username)}" aria-label="حالة ${esc(r.name)}">
      ${['active', 'leave', 'inactive'].map(k => `<option value="${k}" ${r.state === k ? 'selected' : ''}>${STATE_LABEL[k]}</option>`).join('')}</select>
      ${r.leave ? `<div class="leave-note"><span class="num">${esc(fmtDay(r.leave.from))} → ${esc(fmtDay(r.leave.to))}</span><button class="linkbtn" data-leave-edit="${esc(r.username)}">تعديل / تمديد</button></div>` : ''}`;
  const cols = [
    { label: 'الممرضة', html: r => `<div style="display:flex;align-items:center;gap:10px"><span class="avatar sm">${esc(initials(r.name))}</span><div><b style="font-weight:600">${esc(r.name)}</b><div class="muted" style="font-size:11.5px" dir="ltr">${esc(r.email || '')}</div></div></div>`, csv: r => r.name },
    { label: 'الفرع', get: r => br(r.branch) },
    { label: 'هذا الأسبوع', html: r => r.state === 'inactive' ? '<span class="muted">—</span>' : timingPill(r.thisWeek), csv: r => r.state === 'inactive' ? '' : t('st_' + r.thisWeek) },
    { label: 'آخر 12 أسبوع', html: r => `<div class="heat">${r.cells.map((c, i) => `<i class="${c}" title="${fmtShort(d.weeks[i])} — ${t('st_' + c)}"></i>`).join('')}</div>`, csv: r => r.cells.map(c => t('st_' + c)).join(' | ') },
    { label: 'الالتزام', html: r => `<span class="num strong">${pct(r.compliance)}</span>`, csv: r => pct(r.compliance) },
    { label: 'الحالة', html: statusCell, csv: r => STATE_LABEL[r.state] + (r.leave ? ` (${r.leave.from} → ${r.leave.to})` : '') },
  ];
  const filtered = () => d.roster.filter(r =>
    (hrState.branch === 'ALL' || r.branch === hrState.branch) &&
    (hrState.filter === 'all' ? r.state !== 'inactive'
      : hrState.filter === 'missing' ? (r.thisWeek === 'missing' && r.state === 'active')
      : hrState.filter === 'leave' ? r.state === 'leave' : r.state === 'inactive') &&
    (!hrState.q || (r.name + ' ' + (r.email || '')).toLowerCase().includes(hrState.q.toLowerCase())));

  const draw = () => {
    $('#roster').innerHTML = tableHTML(cols, filtered(), { empty: 'لا توجد نتائج' });
    $$('#roster [data-status]').forEach(sel => sel.onchange = async () => {
      const r = d.roster.find(x => x.username === sel.dataset.status), v = sel.value;

      if (v === 'leave') return leaveDialog(r, () => renderHR(view), revert);
      if (v === 'inactive' && !(await confirmDialog(`تحويل ${r.name} إلى «متوقفة عن العمل»؟ لن يُطلب منها التقرير من الأسبوع الجاري، وتبقى تقاريرها السابقة محفوظة.`))) return revert();
      sel.disabled = true;
      try {

        toast(`${r.name}: ${STATE_LABEL[v]}`);
        renderHR(view);
      } catch (e) { sel.disabled = false; revert(); toast(e.message, 'err'); }
    });
    $$('#roster [data-leave-edit]').forEach(b => b.onclick = () => leaveDialog(d.roster.find(x => x.username === b.dataset.leaveEdit), () => renderHR(view)));
  };
  draw();
  $('#r-q').oninput = e => { hrState.q = e.target.value; draw(); };
  $('#r-br').onchange = e => { hrState.branch = e.target.value; draw(); };
  $('#r-f').onchange = e => { hrState.filter = e.target.value; draw(); };
  $('#r-csv').onclick = () => exportTable('حالة-الممرضات-' + d.week, cols, filtered());

  $('#cards').innerHTML = tableHTML([
    { label: 'العيادة', get: r => r.clinic_name + ' — ' + br(r.branch) },
    { label: 'آخر من أبلغ', key: 'nurse_name' },
    { label: 'منذ', html: r => `<span class="num">${r.ageDays}</span> يوم` },
    { label: 'التكرار', html: r => r.occurrences > 1 ? `<span class="repeat">${r.occurrences} أسابيع</span>` : '—' },
    { label: 'الحالة', html: r => statusPill(r.status) },
    { label: '', html: r => `<button class="btn sm" data-issue="${esc(r.issue_id)}">تحديث</button>` },
  ], d.cardIssues, { empty: 'كل البطاقات موجودة' });
  $$('#cards [data-issue]').forEach(b => b.onclick = () => issueDialog(d.cardIssues.find(i => i.issue_id === b.dataset.issue), () => renderHR(view)));
}

/** تحديد فترة الإجازة أو تعديلها / تمديدها */
function leaveDialog(r, done, onCancel) {
  const cur = r.leave, from0 = cur ? cur.from : ymd(new Date());
  let saved = false;
  modal({
    title: (cur ? 'تعديل إجازة ' : 'إجازة ') + r.name,
    body: `<div class="grid g-2e" style="gap:0 14px">
        <div class="field"><label for="lv-f">من</label><input class="input" id="lv-f" type="date" value="${from0}"></div>
        <div class="field"><label for="lv-t">إلى</label><input class="input" id="lv-t" type="date" value="${cur ? cur.to : addDays(from0, 6)}"></div></div>
      <p class="muted" style="font-size:12.5px">لا يُحسب عليها التقرير الأسبوعي خلال هذه الفترة. إذا طالت الإجازة عدّل تاريخ النهاية من نفس الصف.</p><div id="lv-err"></div>`,
    foot: `<button class="btn" data-close>إلغاء</button><button class="btn primary" id="lv-save">${icon('check')}حفظ الإجازة</button>`,
    onClose: () => { if (!saved && onCancel) onCancel(); },
    onMount(el, close) {
      $('#lv-save', el).onclick = async () => {
        const b = $('#lv-save', el), from = $('#lv-f', el).value, to = $('#lv-t', el).value;
        if (!from || !to) { $('#lv-err', el).innerHTML = '<div class="form-error">حدد تاريخ البداية والنهاية</div>'; return; }
        if (to < from) { $('#lv-err', el).innerHTML = '<div class="form-error">تاريخ النهاية قبل تاريخ البداية</div>'; return; }
        busy(b, true);
        try {
          await api('users.setStatus', { username: r.username, status: 'leave', leave_from: from, leave_to: to });
          saved = true; close(); toast(`إجازة ${r.name}: ${fmtDay(from)} → ${fmtDay(to)}`); done && done();
        } catch (e) { busy(b, false); $('#lv-err', el).innerHTML = `<div class="form-error">${esc(e.message)}</div>`; }
      };
    },
  });
}

/* ══════════════════════════════════════════════════════════
   QUALITY — الجودة والإحصائيات
   ══════════════════════════════════════════════════════════ */
const qState = { period: '12w', month: '', branch: 'ALL' };

function thisSaturday() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() - 6 + 7) % 7));
  return ymd(d);
}
function periodRange(p, month) {
  const to = thisSaturday();
  if (p === 'week') return { from: to, to, label: 'هذا الأسبوع' };
  if (p === '4w') return { from: addDays(to, -21), to, label: 'آخر 4 أسابيع' };
  if (p === '12w') return { from: addDays(to, -77), to, label: 'آخر 12 أسبوع' };
  if (p === '26w') return { from: addDays(to, -175), to, label: 'آخر 6 أشهر' };
  // شهر محدد: كل أسابيع السبت التي تقع داخل الشهر
  const [y, m] = (month || to.slice(0, 7)).split('-').map(Number);
  const first = new Date(y, m - 1, 1); first.setDate(first.getDate() + ((6 - first.getDay() + 7) % 7));
  const last = new Date(y, m, 0); last.setDate(last.getDate() - ((last.getDay() - 6 + 7) % 7));
  return { from: ymd(first), to: ymd(last), label: new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', { month: 'long', year: 'numeric' }).format(first) };
}

function kpiCard(label, val, unit, sub, hero, i) {
  const v = val == null ? '—' : `<span data-count="${val}">0</span>`;
  const isInt = val != null && Number.isInteger(val);
  return `<div class="card kpi ${hero ? 'hero' : ''} rise" style="--i:${i}"><div class="k-label">${esc(label)}</div>
    <div class="k-val num">${isInt ? v : (val == null ? '—' : val)}${val != null && unit ? `<small>${unit}</small>` : ''}</div>
    ${hero && val != null ? `<div class="meter"><i style="width:${val}%"></i></div>` : ''}<div class="k-sub">${esc(sub)}</div></div>`;
}

async function renderIssues(view) {

  let d, counts;

    [d, counts] = await Promise.all([
      api('issues.list', { status: statuses, department: iState.dept }),
      api('issues.list', { status: ['open', 'in_progress', 'resolved'], department: iState.dept }),
    ]);
  } catch (e) { return errorBlock(view, e, () => renderIssues(view)); }
  if (!view.isConnected) return; // تم الانتقال لصفحة أخرى أثناء التحميل

      <article class="card issue rise sev-${i.severity}" style="--i:${Math.min(n, 12)}">
        <div class="top">${sevPill(i.severity)}${statusPill(i.status)}<span class="tag">${esc(i.categoryLabel)}</span>${i.occurrences > 1 ? `<span class="repeat">${icon('alert')}تكرر ${i.occurrences} أسابيع</span>` : ''}</div>
        <h4>${esc(i.item || i.categoryLabel)}${i.qty ? ` <span class="muted num" style="font-weight:500">× ${esc(i.qty)}</span>` : ''}</h4>
        <p class="desc">${esc(i.description)}</p>
        <div class="meta"><span><b>${esc(i.clinic_name)}</b> · ${br(i.branch)}</span><span>${esc(i.nurse_name)}</span><span>منذ <b class="num">${i.ageDays}</b> يوم</span>${!supply ? `<span>${DEPT[i.department] || ''}</span>` : ''}</div>
        ${i.assigned_to ? `<div class="meta"><span>المسؤول: <b>${esc(i.assigned_to)}</b></span></div>` : ''}
        ${i.resolution ? `<div class="meta"><span>الإجراء: <b>${esc(i.resolution)}</b></span></div>` : ''}
        <div class="act">${i.status !== 'resolved' ? `
          ${i.status === 'open' ? `<button class="btn sm" data-start="${esc(i.issue_id)}">بدء المعالجة</button>` : ''}
          <button class="btn sm primary" data-edit="${esc(i.issue_id)}">${icon('check')}إغلاق</button>` : `<button class="btn sm" data-edit="${esc(i.issue_id)}">تفاصيل</button>`}</div>
      </article>`).join('') : `<div class="card empty" style="grid-column:1/-1"><b>لا توجد عناصر</b>${iState.status === 'resolved' ? 'لم يتم إغلاق أي مشكلة بعد' : 'كل شيء تحت السيطرة'}</div>`;
    $$('#issue-list [data-start]').forEach(b => b.onclick = async () => {
      busy(b, true);
      try { await api('issues.update', { issue_id: b.dataset.start, status: 'in_progress', assigned_to: state.user.name }); toast('تم تحويلها إلى قيد المعالجة'); renderIssues(view); }
      catch (e) { busy(b, false); toast(e.message, 'err'); }
    });
    $$('#issue-list [data-edit]').forEach(b => b.onclick = () => issueDialog(d.issues.find(i => i.issue_id === b.dataset.edit), () => renderIssues(view)));
  };
  draw();
  $('#i-q').oninput = e => { iState.q = e.target.value; draw(); };
  $('#i-b').onchange = e => { iState.branch = e.target.value; draw(); };
  $('#i-c').onchange = e => { iState.cat = e.target.value; draw(); };
}

function issueDialog(i, done) {
  if (!i) return;
  const closed = i.status === 'resolved';
  modal({
    title: i.item || i.categoryLabel,
    body: `<dl class="kv">
      <dt>النوع</dt><dd>${esc(i.categoryLabel)} · ${sevPill(i.severity)}</dd>
      <dt>العيادة</dt><dd>${esc(i.clinic_name)} — ${br(i.branch)}</dd>
      <dt>الوصف</dt><dd>${esc(i.description)}</dd>
      <dt>أبلغت</dt><dd>${esc(i.nurse_name)} · ${fmtDT(i.created_at)}</dd>
      ${i.occurrences > 1 ? `<dt>التكرار</dt><dd>${i.occurrences} أسابيع · آخرها ${fmtDate(i.last_seen)}</dd>` : ''}
      ${i.updated_by ? `<dt>آخر تحديث</dt><dd>${esc(i.updated_by)} · ${fmtDT(i.updated_at)}</dd>` : ''}
      </dl>
      <div style="margin-top:18px">
        <div class="field"><label for="d-as">المسؤول عن المعالجة</label><input class="input" id="d-as" value="${esc(i.assigned_to || state.user.name)}"></div>
        <div class="field"><label for="d-res">الإجراء المتخذ ${closed ? '' : '(مطلوب للإغلاق)'}</label><textarea class="input" id="d-res" placeholder="مثال: تم صرف 2 من المستودع بتاريخ …">${esc(i.resolution || '')}</textarea></div>
        <div id="d-err"></div>
      </div>`,
    foot: closed
      ? `<button class="btn" data-st="open">إعادة فتح</button><button class="btn primary" data-st="resolved">حفظ</button>`
      : `<button class="btn" data-st="in_progress">حفظ كقيد المعالجة</button><button class="btn primary" data-st="resolved">${icon('check')}تم الحل</button>`,
    onMount(el, close) {
      $$('[data-st]', el).forEach(b => b.onclick = async () => {
        busy(b, true);
        try {
          await api('issues.update', { issue_id: i.issue_id, status: b.dataset.st, assigned_to: $('#d-as', el).value, resolution: $('#d-res', el).value });
          close(); toast(b.dataset.st === 'resolved' ? 'تم إغلاق المشكلة' : 'تم الحفظ'); done && done();
        } catch (e) { busy(b, false); $('#d-err', el).innerHTML = `<div class="form-error">${esc(e.message)}</div>`; }
      });
    },
  });
}

/* ══════════════════════════════════════════════════════════
   REPORTS — سجل التقارير
   ══════════════════════════════════════════════════════════ */
const rState = { period: 'week', month: '', branch: 'ALL', q: '' };
async function renderReports(view) {
  skeleton(view, [80, 460]);
  const range = periodRange(rState.period, rState.month);
  let d;
  try { d = await api('reports.list', { from: range.from, to: range.to, branch: rState.branch }); }
  catch (e) { return errorBlock(view, e, () => renderReports(view)); }
  if (!view.isConnected) return; // تم الانتقال لصفحة أخرى أثناء التحميل
  view.innerHTML = `
  <div class="page-head rise"><div><h1>سجل التقارير</h1><p>${esc(range.label)} · <span class="num">${d.reports.length}</span> تقرير</p></div><div class="spacer"></div>
    <div class="toolbar">
      <input class="input" id="rp-q" placeholder="بحث" value="${esc(rState.q)}">
      <select class="input" id="rp-p"><option value="week">هذا الأسبوع</option><option value="4w">آخر 4 أسابيع</option><option value="12w">آخر 12 أسبوع</option><option value="month">شهر محدد</option></select>
      <input class="input ${rState.period === 'month' ? '' : 'hidden'}" type="month" id="rp-m" value="${rState.month || thisSaturday().slice(0, 7)}">
      <select class="input" id="rp-b"><option value="ALL">كل الفروع</option><option value="BURIDAH">بريدة</option><option value="ONIZAH">عنيزة</option></select>
      <button class="btn sm" id="rp-csv">${icon('dl')}CSV</button>
    </div></div>
  <section class="card rise" id="rp-t"></section>`;
  $('#rp-p').value = rState.period; $('#rp-b').value = rState.branch;
  $('#rp-p').onchange = e => { rState.period = e.target.value; renderReports(view); };
  $('#rp-m').onchange = e => { rState.month = e.target.value; renderReports(view); };
  $('#rp-b').onchange = e => { rState.branch = e.target.value; renderReports(view); };
  const yn = v => v === 'yes' ? 'نعم' : v === 'no' ? 'لا' : '—';
  const cols = [
    { label: 'التاريخ', get: r => fmtDT(r.submitted_at) },
    { label: 'الممرضة', html: r => `<b style="font-weight:500">${esc(r.nurse_name)}</b>`, csv: r => r.nurse_name },
    { label: 'العيادة', get: r => r.clinic_name + ' — ' + br(r.branch) },
    { label: 'التوقيت', html: r => timingPill(r.timing), csv: r => t('st_' + r.timing) },
    { label: 'أقرب انتهاء', get: r => r.earliest_expiry ? fmtDate(r.earliest_expiry, { day: 'numeric', month: 'short', year: 'numeric' }) : '—' },
    { label: 'بنود للمتابعة', html: r => r.issues_count ? `<span class="pill warn">${icon('alert')}${r.issues_count}</span>` : '<span class="muted">—</span>', csv: r => r.issues_count },
    { label: 'فحص الصلاحية', get: r => yn(r.expiry_checked), hide: true },
    { label: 'التعقيم', get: r => yn(r.sterilization_ok), hide: true },
    { label: 'الثلاجة', get: r => ({ ok: 'سليمة', problem: 'مشكلة', none: 'لا توجد' }[r.fridge] || '—'), hide: true },
    { label: 'بطاقة الموظف', get: r => yn(r.employee_card), hide: true },
    { label: 'النظافة', get: r => r.cleanliness || '—', hide: true },
    { label: 'الأدوات الناقصة', get: r => r.tools.map(x => `${x.item} ×${x.qty}`).join('، ') || '—', hide: true },
    { label: 'ملاحظات', get: r => [r.other_issue, r.notes].filter(Boolean).join(' / ') || '—', hide: true },
  ];
  const list = () => d.reports.filter(r => !rState.q || [r.nurse_name, r.clinic_name].join(' ').toLowerCase().includes(rState.q.toLowerCase()));
  const draw = () => {
    $('#rp-t').innerHTML = tableHTML(cols.filter(c => !c.hide), list(), { empty: 'لا توجد تقارير في هذه الفترة', rowAttr: r => `class="click" data-id="${esc(r.report_id)}" tabindex="0"` });
    $$('#rp-t tr[data-id]').forEach(tr => tr.onclick = tr.onkeydown = e => {
      if (e.type === 'keydown' && e.key !== 'Enter') return;
      const r = d.reports.find(x => x.report_id === tr.dataset.id);
      modal({ title: `${r.clinic_name} — ${r.nurse_name}`, wide: true,
        body: `<dl class="kv">${cols.map(c => `<dt>${esc(c.label)}</dt><dd>${c.html ? c.html(r) : esc(c.get(r))}</dd>`).join('')}</dl>` });
    });
  };
  draw();
  $('#rp-q').oninput = e => { rState.q = e.target.value; draw(); };
  $('#rp-csv').onclick = () => exportTable('التقارير-' + range.from + '_' + range.to, cols, list());
}

/* ══════════════════════════════════════════════════════════
   USERS — المستخدمون
   ══════════════════════════════════════════════════════════ */
const uState = { q: '', role: 'nurse', status: 'active' };
async function renderUsers(view) {
  skeleton(view, [80, 460]);
  let d;
  try { d = await api('users.list'); }
  catch (e) { return errorBlock(view, e, () => renderUsers(view)); }
  if (!view.isConnected) return; // تم الانتقال لصفحة أخرى أثناء التحميل
  const admin = state.user.role === 'admin';
  const clinicName = id => { const c = d.clinics.find(x => x.clinic_id === id); return c ? c.name + ' — ' + br(c.branch) : id; };
  view.innerHTML = `
  <div class="page-head rise"><div><h1>المستخدمون</h1><p>${admin ? 'إدارة حسابات الممرضات والأقسام' : 'إدارة حسابات الممرضات'}</p></div><div class="spacer"></div>
    <div class="toolbar">
      <input class="input" id="u-q" placeholder="بحث بالاسم أو البريد" value="${esc(uState.q)}">
      ${admin ? `<select class="input" id="u-r"><option value="all">كل الأدوار</option>${Object.keys(d.roles).map(r => `<option value="${r}">${d.roles[r]}</option>`).join('')}</select>` : ''}
      <select class="input" id="u-s"><option value="all">كل الحالات</option><option value="active">نشط</option><option value="inactive">غير نشط</option></select>
      <button class="btn primary sm" id="u-new">${icon('plus')}${admin ? 'مستخدم جديد' : 'ممرضة جديدة'}</button>
    </div></div>
  <section class="card rise" id="u-t"></section>`;
  if ($('#u-r')) $('#u-r').value = uState.role;
  $('#u-s').value = uState.status;
  const cols = [
    { label: 'الاسم', html: u => `<div style="display:flex;gap:10px;align-items:center"><span class="avatar" style="width:28px;height:28px;font-size:11px">${esc(initials(u.name))}</span><div><b style="font-weight:600">${esc(u.name)}</b><div class="muted" dir="ltr" style="font-size:11.5px;text-align:start">${esc(u.email || u.username)}</div></div></div>` },
    { label: 'الدور', get: u => d.roles[u.role] || u.role },
    { label: 'الفرع', get: u => br(u.branch) },
    { label: 'العيادات', get: u => u.clinics.length ? u.clinics.length + ' عيادة' : (u.role === 'nurse' ? 'كل عيادات الفرع' : '—') },
    { label: 'الحالة', html: u => u.role !== 'nurse' ? (u.status === 'active' ? `<span class="pill good">${icon('check')}نشط</span>` : `<span class="pill">${icon('dash')}غير نشط</span>`)
        : u.state === 'leave' ? `<span class="pill accent">${icon('clock')}إجازة</span><div class="muted num" style="font-size:11px;margin-top:3px">${esc(fmtDay(u.leave.from))} → ${esc(fmtDay(u.leave.to))}</div>`
        : u.state === 'inactive' ? `<span class="pill">${icon('dash')}متوقفة عن العمل</span>` : `<span class="pill good">${icon('check')}على رأس العمل</span>` },
    { label: 'آخر دخول', html: u => u.must_change ? '<span class="tag">لم يسجّل بعد</span>' : esc(u.last_login ? fmtDT(u.last_login) : '—') },
    { label: '', html: u => `<div style="display:flex;gap:6px"><button class="btn sm" data-edit="${esc(u.username)}">تعديل</button><button class="btn sm ghost" data-reset="${esc(u.username)}">كلمة مرور مؤقتة</button></div>` },
  ];
  const draw = () => {
    const q = uState.q.toLowerCase();
    const list = d.users.filter(u => (!admin || uState.role === 'all' || u.role === uState.role) && (uState.status === 'all' || u.status === uState.status) &&
      (!q || (u.name + ' ' + u.email + ' ' + u.username).toLowerCase().includes(q)));
    $('#u-t').innerHTML = tableHTML(cols, list, { empty: 'لا يوجد مستخدمون' });
    $$('#u-t [data-edit]').forEach(b => b.onclick = () => userDialog(d, d.users.find(u => u.username === b.dataset.edit), () => renderUsers(view)));
    $$('#u-t [data-reset]').forEach(b => b.onclick = async () => {
      const u = d.users.find(x => x.username === b.dataset.reset);
      if (!await confirmDialog(`إنشاء كلمة مرور مؤقتة جديدة لـ ${u.name}؟ ستتوقف كلمة المرور الحالية.`)) return;
      busy(b, true);
      try { const r = await api('users.reset', { username: u.username }); busy(b, false); showTemp(u.name, r.username, r.tempPassword); }
      catch (e) { busy(b, false); toast(e.message, 'err'); }
    });
  };
  draw();
  $('#u-q').oninput = e => { uState.q = e.target.value; draw(); };
  $('#u-r') && ($('#u-r').onchange = e => { uState.role = e.target.value; draw(); });
  $('#u-s').onchange = e => { uState.status = e.target.value; draw(); };
  $('#u-new').onclick = () => userDialog(d, null, () => renderUsers(view));
}

function userDialog(d, u, done) {
  const admin = state.user.role === 'admin';
  const isNew = !u;
  u = u || { role: 'nurse', branch: state.user.branch !== 'ALL' ? state.user.branch : 'BURIDAH', clinics: [], status: 'active' };
  const branchOpts = (admin ? ['ALL'] : []).concat(Object.keys(d.branches)).filter(b => state.user.branch === 'ALL' || b === state.user.branch);
  modal({
    title: isNew ? 'إضافة مستخدم' : 'تعديل: ' + u.name, wide: true,
    body: `<div class="grid g-2e" style="gap:0 14px">
      <div class="field"><label for="uf-n">الاسم</label><input class="input" id="uf-n" value="${esc(u.name || '')}"></div>
      <div class="field"><label for="uf-e">البريد الإلكتروني (إلزامي للممرضة: تصلها عليه تذكيرات التقرير)</label><input class="input" id="uf-e" dir="ltr" value="${esc(u.email || '')}"></div>
      ${admin ? `<div class="field"><label for="uf-r">الدور</label><select class="input" id="uf-r">${Object.keys(d.roles).map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${d.roles[r]}</option>`).join('')}</select></div>` : ''}
      ${isNew ? `<div class="field"><label for="uf-u">اسم المستخدم للدخول (اختياري)</label><input class="input" id="uf-u" dir="ltr" autocapitalize="off" placeholder="يُستخدم البريد إذا تُرك فارغاً"></div>` : ''}
      <div class="field"><label for="uf-b">الفرع</label><select class="input" id="uf-b">${branchOpts.map(b => `<option value="${b}" ${u.branch === b ? 'selected' : ''}>${br(b)}</option>`).join('')}</select></div>
      <div class="field"><label for="uf-sd">تاريخ بداية المسؤولية</label><input class="input" id="uf-sd" type="date" value="${esc(u.start_date || ymd(new Date()))}"></div>
    </div>
    <div class="field" id="uf-cl-wrap"><label>العيادات المسؤولة عنها <span class="muted">(اتركها فارغة: تظهر كل أقسام الفرع ما عدا التعقيم. حدّد وحدة التعقيم لممرضة التعقيم فقط)</span></label><div class="chips" id="uf-cl"></div></div>
    <div id="uf-err"></div>`,
    foot: `<button class="btn" data-close>إلغاء</button><button class="btn primary" id="uf-save">حفظ</button>`,
    onMount(el, close) {
      const drawClinics = () => {
        const b = $('#uf-b', el).value;
        const role = $('#uf-r', el) ? $('#uf-r', el).value : 'nurse';
        $('#uf-cl-wrap', el).classList.toggle('hidden', role !== 'nurse');
        $('#uf-cl', el).innerHTML = d.clinics.filter(c => c.status === 'active' && (b === 'ALL' || c.branch === b))
          .map(c => `<label><input type="checkbox" value="${esc(c.clinic_id)}" ${u.clinics.includes(c.clinic_id) ? 'checked' : ''}>${esc(c.name)}</label>`).join('');
      };
      drawClinics();
      $('#uf-b', el).onchange = drawClinics;
      $('#uf-r', el) && ($('#uf-r', el).onchange = drawClinics);
      $('#uf-save', el).onclick = async () => {
        const b = $('#uf-save', el);
        busy(b, true);
        const payload = {
          username: isNew ? '' : u.username, name: $('#uf-n', el).value, email: $('#uf-e', el).value,
          role: $('#uf-r', el) ? $('#uf-r', el).value : 'nurse', branch: $('#uf-b', el).value,
          start_date: $('#uf-sd', el).value,
          clinics: $$('#uf-cl input:checked', el).map(x => x.value), newUsername: $('#uf-u', el) ? $('#uf-u', el).value : '',
        };
        try {
          const r = await api('users.save', { user: payload });
          close(); done && done();
          if (r.tempPassword) showTemp(payload.name, r.username, r.tempPassword); else toast('تم الحفظ');
        } catch (e) { busy(b, false); $('#uf-err', el).innerHTML = `<div class="form-error">${esc(e.message)}</div>`; }
      };
    },
  });
}

function showTemp(name, username, pass) {
  const msg = `ApexCare Nursing\nUsername: ${username}\nTemporary password: ${pass}\nYou will be asked to set your own password on first sign-in.\n${location.origin + location.pathname}`;
  modal({
    title: 'كلمة المرور المؤقتة',
    body: `<p style="margin-bottom:12px">أرسل بيانات الدخول إلى <b>${esc(name)}</b>. ستُطلب منها كلمة مرور جديدة عند أول دخول. لن تظهر هذه الكلمة مرة أخرى.</p>
      <div class="kv" style="margin-bottom:12px"><dt>اسم المستخدم</dt><dd dir="ltr" style="text-align:start">${esc(username)}</dd></div>
      <div class="temp-pass">${esc(pass)}</div>`,
    foot: `<button class="btn primary" id="tp-copy">${icon('copy')}نسخ رسالة الدخول</button>`,
    onMount(el) { $('#tp-copy', el).onclick = () => copyText(msg); },
  });
}

/* ══════════ START ══════════ */
applyLang(state.lang);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.getAttribute('data-theme')) rerender(); });
boot();
</script>
</body>
